name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Check
        run: cargo check --workspace


  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve dependency graph
        run: cargo generate-lockfile

      - name: Install RustSec auditor
        run: cargo install cargo-audit --locked

      - name: Audit dependency advisories
        run: cargo audit

      - name: Reject unexpected unsafe Rust
        shell: bash
        run: |
          if grep -R --line-number --include='*.rs' -E 'unsafe[[:space:]]*\{|unsafe[[:space:]]+fn|unsafe[[:space:]]+impl|extern[[:space:]]+"C"' crates apps; then
            echo "Unexpected unsafe Rust or FFI boundary found"
            exit 1
          fi

      - name: Reject phase scaffolding
        shell: bash
        run: |
          if find . -path './.git' -prune -o -type f -print | grep -Ei '/phase[-_ ]?[0-9]|phase[-_ ]?[0-9]'; then
            echo "Phase-specific scaffolding must not ship"
            exit 1
          fi
