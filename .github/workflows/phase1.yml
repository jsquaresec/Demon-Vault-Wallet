name: Phase 1 Threat Model Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase1:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test security gates
        run: cargo test
      - name: Validate Phase 0 and Phase 1
        run: cargo run
