name: Phase 3 Cryptographic Vault Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Lint full workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test full workspace
        run: cargo test --workspace

      - name: Check full workspace
        run: cargo check --workspace

      - name: Validate Phase 0 through Phase 3
        run: cargo run -- phase3
