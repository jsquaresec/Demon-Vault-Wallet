name: Release Candidate Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*-rc.*"

permissions:
  contents: read

jobs:
  build-candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate workspace
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p demon-vault-desktop

      - name: Candidate notice
        shell: bash
        run: |
          echo "This workflow builds release candidates only."
          echo "It does not mark signed-release, installer-matrix, independent-audit, or mainnet gates complete."
